# ===== Application =====
quarkus.application.name=school-canopy
quarkus.application.version=1.0.0-SNAPSHOT

# ===== HTTP Server =====
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:4200,http://localhost:4201
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Cookie,X-Portal
quarkus.http.cors.exposed-headers=Set-Cookie
quarkus.http.cors.access-control-allow-credentials=true

# ===== Datasource =====
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=schoolcanopy
quarkus.datasource.password=schoolcanopy_dev
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/schoolcanopy

# ===== Hibernate ORM =====
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ===== Flyway =====
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.baseline-on-migrate=true

# ===== Session Cookie =====
quarkus.http.same-site-cookie.session-token.value=Strict
quarkus.http.same-site-cookie.session-token.case-sensitive=false

# ===== Dev Profile =====
%dev.quarkus.datasource.username=schoolcanopy
%dev.quarkus.datasource.password=schoolcanopy_dev
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/schoolcanopy
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.log.level=INFO
%dev.quarkus.log.category."com.schoolcanopy".level=DEBUG

# ===== OpenAPI / Swagger =====
quarkus.smallrye-openapi.info-title=School Canopy API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST API for School Canopy - School Management Platform
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# Disable Swagger UI in production
%prod.quarkus.swagger-ui.always-include=false

# ===== Test Profile =====
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.hibernate-orm.log.sql=true
