<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Canopy — Mobile App Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#4a6b8a;--primary-dark:#33506b;--primary-tint:#e8eef3;
    --warning:#ba7517;--warning-tint:#fdf1e2;
    --success:#3f7d52;--success-tint:#e7f3ea;
    --text:#111;--text-secondary:#777;--text-muted:#9a9a9a;--text-faint:#8a8a8a;
    --border:#e4e4e4;--bg:#f5f4f2;--surface:#ffffff;
    --radius:18px;--radius-sm:14px;
    --shadow:0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04);
    --shadow-lg:0 4px 6px rgba(0,0,0,0.04), 0 10px 24px rgba(0,0,0,0.06);
  }
  @media(prefers-color-scheme:dark){
    :root{
      --primary:#7ba3c4;--primary-dark:#c8dae8;--primary-tint:#1e293b;
      --text:#e8e8e8;--text-secondary:#a8a8a8;--text-muted:#707070;--text-faint:#606060;
      --border:#2d2d2d;--bg:#0f1117;--surface:#1a1d26;
      --shadow:0 1px 2px rgba(0,0,0,0.2), 0 4px 12px rgba(0,0,0,0.15);
      --shadow-lg:0 4px 6px rgba(0,0,0,0.3), 0 10px 24px rgba(0,0,0,0.2);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:#eceae6;color:var(--text);-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.brand{font-family:'Poppins',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;text-decoration:none;}

  .page-topbar{height:60px;background:color-mix(in srgb, var(--surface) 90%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20;}
  .brand-mark{display:flex;align-items:center;gap:10px;}
  .brand-name{font-size:16px;font-weight:600;}
  .role-pill{font-size:11px;font-weight:600;color:var(--primary);background:var(--primary-tint);padding:3px 10px;border-radius:999px;margin-left:8px;letter-spacing:.02em;}

  .shell{display:flex;min-height:calc(100vh - 60px);}
  .sidebar{width:240px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:18px 10px;overflow-y:auto;}
  .sidebar-label{font-size:10.5px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;padding:10px 12px 6px;}
  .screen-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--text-secondary);cursor:pointer;margin-bottom:2px;transition:all .2s ease;}
  .screen-item:hover{background:var(--bg);transform:translateX(2px);}
  .screen-item.active{background:var(--primary-tint);color:var(--primary-dark);font-weight:600;}
  .screen-num{width:18px;height:18px;border-radius:5px;background:var(--border);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .screen-item.active .screen-num{background:var(--primary);}

  .stage{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px;overflow-y:auto;}
  .phone{
    width:393px;background:var(--bg);border-radius:48px;border:10px solid #1a1a1a;
    box-shadow:0 20px 50px rgba(0,0,0,0.18), 0 0 0 1px rgba(255,255,255,0.05) inset;overflow:hidden;position:relative;flex-shrink:0;
  }
  .phone-screen{height:852px;overflow-y:auto;position:relative;}
  .phone-screen::-webkit-scrollbar{width:0;}
  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 6px;font-size:15px;font-weight:700;}
  .statusbar .icons{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:400;}

  /* Bottom nav */
  .bottomnav{
    position:sticky;bottom:0;left:0;right:0;background:color-mix(in srgb, #fff 92%, transparent);backdrop-filter:blur(16px);border-top:1px solid var(--border);
    display:flex;padding:10px 0 22px;
  }
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--text);transition:color .15s;}
  .bn-item.active{color:var(--primary);font-weight:700;}
  .bn-item svg{width:22px;height:22px;}

  .btn{font-family:'Inter',sans-serif;font-size:14px;font-weight:600;border-radius:999px;padding:10px 20px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:all .15s ease;}
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;width:100%;padding:15px;font-size:15px;}
  .btn-primary:hover{background:color-mix(in srgb, var(--primary) 85%, #000);box-shadow:0 4px 12px rgba(74,107,138,0.3);}

  /* ---- shared card styles ---- */
  .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);}
  .avatar-circle{border-radius:50%;background:var(--primary-dark);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
  .chip{font-size:12px;font-weight:600;padding:9px 16px;border-radius:999px;white-space:nowrap;transition:all .15s ease;}
  .chip.active{background:var(--primary);color:#fff;}
  .chip.inactive{background:#fff;color:#555;border:1px solid var(--border);}
  .chip.inactive:hover{border-color:var(--primary);background:var(--primary-tint);}

  /* Sign in */
  .signin-wrap{padding:40px 26px 26px;}
  .signin-logo{display:flex;justify-content:center;margin-bottom:14px;}
  .signin-title{font-size:26px;font-weight:700;text-align:center;font-family:'Poppins',sans-serif;}
  .signin-tagline{font-size:13px;color:var(--text-secondary);text-align:center;margin-top:6px;margin-bottom:32px;}
  .tab-toggle{display:flex;background:var(--bg);border-radius:999px;padding:4px;margin-bottom:22px;}
  .tab-toggle .t{flex:1;text-align:center;padding:9px 0;font-size:13px;font-weight:600;border-radius:999px;color:var(--text-secondary);cursor:pointer;transition:all .2s;}
  .tab-toggle .t.active{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,0.08);}
  .input-label{font-size:12.5px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;display:block;}
  .input-field{width:100%;font-family:'Inter',sans-serif;font-size:15px;padding:14px 16px;border:1px solid var(--border);border-radius:14px;margin-bottom:18px;background:#fff;transition:border-color .2s, box-shadow .2s;}
  .input-field:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
  .row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;font-size:13px;}
  .remember{display:flex;align-items:center;gap:8px;color:var(--text-secondary);}
  .forgot{color:var(--primary);font-weight:600;}
  .touchid{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:13px;color:var(--primary-dark);font-weight:600;}
  .signin-footer{font-size:12px;color:var(--text-muted);text-align:center;margin-top:36px;line-height:1.5;}

  /* Home */
  .home-header{display:flex;align-items:center;gap:14px;padding:6px 24px 8px;}
  .home-greet{font-size:19px;font-weight:700;font-family:'Poppins',sans-serif;line-height:1.3;}
  .id-card{margin:14px 24px;padding:22px;border-radius:22px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;position:relative;overflow:hidden;}
  .id-card::after{content:'';position:absolute;top:-30px;right:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,0.08);}
  .id-card-top{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
  .id-card-avatar{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;}
  .id-card-name{font-size:18px;font-weight:700;}
  .id-card-meta{font-size:12.5px;opacity:0.85;margin-top:2px;}
  .id-card-divider{border-top:1px dashed rgba(255,255,255,0.35);margin-bottom:14px;}
  .id-card-id-label{font-size:10.5px;letter-spacing:.06em;opacity:0.75;}
  .id-card-id{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;margin-top:3px;}
  .stat-row{display:flex;gap:12px;padding:6px 24px 4px;}
  .stat-box{flex:1;background:#fff;border-radius:16px;padding:16px 10px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border);transition:transform .2s ease;}
  .stat-box:hover{transform:translateY(-1px);}
  .stat-num{font-size:24px;font-weight:700;font-family:'Poppins',sans-serif;color:var(--primary-dark);}
  .stat-lbl{font-size:10.5px;color:var(--text-secondary);margin-top:4px;}
  .section-label{font-size:11px;font-weight:700;color:var(--text-faint);letter-spacing:.05em;padding:22px 24px 10px;}
  .home-event-row,.home-ann-row{display:flex;gap:14px;align-items:center;background:#fff;border-radius:16px;padding:14px;margin:0 24px 10px;box-shadow:var(--shadow);border:1px solid var(--border);transition:transform .15s ease;}
  .home-event-row:hover,.home-ann-row:hover{transform:translateX(2px);}
  .event-date-box{width:52px;text-align:center;background:var(--primary-tint);border-radius:12px;padding:6px 0;flex-shrink:0;}
  .event-date-box .m{font-size:9.5px;font-weight:700;color:var(--primary-dark);letter-spacing:.03em;}
  .event-date-box .d{font-size:15px;font-weight:700;color:var(--primary-dark);}
  .ann-icon-box{width:52px;height:52px;border-radius:14px;background:var(--warning-tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .row-title{font-size:14px;font-weight:700;}
  .row-sub{font-size:12px;color:var(--text-secondary);margin-top:2px;line-height:1.4;}

  /* Calendar */
  .header-simple{padding:20px 24px 6px;}
  .header-simple .name{font-size:17px;font-weight:700;}
  .cal-card{margin:14px 24px;background:#fff;border-radius:20px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--border);}
  .cal-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .cal-title{font-size:16px;font-weight:700;}
  .cal-nav{display:flex;gap:16px;color:var(--primary-dark);font-weight:700;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
  .cal-dow{font-size:11px;color:var(--text-muted);font-weight:600;padding-bottom:6px;}
  .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:12px;position:relative;transition:background .15s;}
  .cal-day:hover{background:var(--primary-tint);}
  .cal-day.today{background:var(--primary-dark);color:#fff;font-weight:700;}
  .cal-day.has-event::after{content:'';position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--warning);}
  .chip-row{display:flex;gap:8px;padding:2px 24px 8px;overflow-x:auto;}

  /* Announcements */
  .ann-top{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 12px;}
  .ann-title{font-size:11px;font-weight:700;color:var(--text-faint);letter-spacing:.05em;}
  .mark-read{font-size:11.5px;color:var(--primary);font-weight:600;}
  .filter-chips{display:flex;gap:8px;padding:0 24px 10px;overflow-x:auto;}
  .ann-card{margin:0 24px 14px;background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);transition:transform .15s ease;}
  .ann-card:hover{transform:translateX(2px);}
  .ann-card-top{display:flex;gap:12px;}
  .ann-time{font-size:10.5px;color:var(--text-muted);white-space:nowrap;margin-left:auto;}
  .ann-tag{display:inline-block;font-size:10px;font-weight:700;padding:4px 12px;border-radius:999px;margin-top:10px;}
  .tag-event{background:var(--primary-tint);color:var(--primary-dark);}
  .tag-action{background:var(--warning-tint);color:var(--warning);}

  /* Messages */
  .msg-top{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 12px;}
  .msg-title{font-size:11px;font-weight:700;color:var(--text-faint);letter-spacing:.05em;}
  .new-btn{font-size:12px;font-weight:700;color:#fff;background:var(--primary);padding:7px 14px;border-radius:999px;transition:all .15s ease;}
  .new-btn:hover{background:color-mix(in srgb, var(--primary) 85%, #000);}
  .search-bar{margin:0 24px 14px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:11px 16px;font-size:13.5px;color:var(--text-muted);transition:border-color .2s;}
  .search-bar:focus{border-color:var(--primary);}
  .conv-row{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:16px;padding:14px;margin:0 24px 10px;box-shadow:var(--shadow);border:1px solid var(--border);transition:transform .15s ease;}
  .conv-row:hover{transform:translateX(2px);}
  .conv-avatar{width:44px;height:44px;border-radius:12px;background:var(--primary-tint);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
  .conv-time{font-size:10.5px;color:var(--text-muted);margin-left:auto;white-space:nowrap;}
  .unread-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:6px;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}

  /* Compose / thread */
  .thread-header{display:flex;align-items:center;gap:10px;padding:18px 20px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(12px);z-index:5;}
  .back-link{font-size:13px;color:var(--primary-dark);font-weight:600;}
  .thread-name{font-size:16px;font-weight:700;flex:1;text-align:center;}
  .field-block{margin:14px 24px;background:#fff;border-radius:14px;padding:12px 16px;border:1px solid var(--border);}
  .field-label-sm{font-size:10.5px;font-weight:700;color:var(--text-muted);letter-spacing:.05em;margin-bottom:4px;}
  .field-value{font-size:14px;}
  .contact-row{display:flex;align-items:center;gap:12px;padding:12px 0;}
  .contact-avatar{width:38px;height:38px;border-radius:10px;background:var(--primary-tint);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;}
  .msg-body-field{min-height:110px;}
  .attach-row{display:flex;align-items:center;gap:10px;color:var(--text-secondary);font-size:13.5px;}

  .bubble-row{padding:6px 24px;}
  .bubble{max-width:78%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.4;}
  .bubble.them{background:#fff;border-bottom-left-radius:4px;}
  .bubble.me{background:var(--primary);color:#fff;border-bottom-right-radius:4px;margin-left:auto;}
  .bubble-time{font-size:10.5px;color:var(--text-muted);margin-top:5px;}
  .bubble-time.me{text-align:right;}
  .thread-with-avatar{display:flex;gap:10px;align-items:flex-end;}
  .msg-input-bar{position:sticky;bottom:0;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(12px);padding:12px 20px 20px;display:flex;gap:10px;align-items:center;}
  .msg-input{flex:1;background:#fff;border:1px solid var(--border);border-radius:22px;padding:12px 18px;font-size:14px;color:var(--text-muted);transition:border-color .2s;}
  .msg-input:focus{border-color:var(--primary);}
  .send-btn{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s ease;}
  .send-btn:hover{background:color-mix(in srgb, var(--primary) 85%, #000);transform:scale(1.05);}

  /* Profile */
  .profile-title{font-size:24px;font-weight:700;text-align:center;padding:18px 0 16px;font-family:'Poppins',sans-serif;}
  .profile-tabs{display:flex;background:var(--bg);border-radius:999px;margin:0 24px 18px;padding:4px;}
  .profile-tabs .pt{flex:1;text-align:center;padding:9px 0;font-size:13px;font-weight:600;border-radius:999px;color:var(--text-secondary);transition:all .2s;}
  .profile-tabs .pt.active{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,0.08);}
  .profile-hero{display:flex;flex-direction:column;align-items:center;padding-bottom:20px;}
  .profile-avatar-lg{width:88px;height:88px;border-radius:50%;background:var(--primary-dark);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:30px;position:relative;}
  .edit-badge{position:absolute;bottom:-2px;right:-2px;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .profile-name{font-size:19px;font-weight:700;margin-top:12px;}
  .profile-sub{font-size:13px;color:var(--text-secondary);margin-top:2px;}
  .detail-card{margin:0 24px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);}
  .detail-row{padding:14px 18px;border-bottom:1px solid var(--border);}
  .detail-row:last-child{border-bottom:none;}
  .detail-label{font-size:10.5px;font-weight:700;color:var(--text-muted);letter-spacing:.05em;}
  .detail-value{font-size:15px;margin-top:4px;}
  .settings-card{margin:0 24px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);}
  .settings-row{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--border);transition:background .15s;}
  .settings-row:last-child{border-bottom:none;}
  .settings-row:hover{background:var(--bg);}
  .settings-icon{width:34px;height:34px;border-radius:10px;background:var(--primary-tint);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .settings-title{font-size:14px;font-weight:600;}
  .settings-sub{font-size:11.5px;color:var(--text-muted);margin-top:1px;}
  .chevron{margin-left:auto;color:var(--text-muted);font-size:18px;}
  .signout-row{margin:0 24px;background:#fff;border-radius:18px;padding:16px;text-align:center;color:var(--danger,#b0473f);font-weight:700;font-size:14.5px;box-shadow:var(--shadow);border:1px solid var(--border);transition:background .15s;}
  .signout-row:hover{background:var(--danger-tint,#fbeaea);}

  /* Change password */
  .lock-hero{display:flex;flex-direction:column;align-items:center;padding:24px 0 8px;}
  .lock-icon{width:76px;height:76px;border-radius:50%;background:var(--primary-tint);display:flex;align-items:center;justify-content:center;}
  .lock-caption{font-size:14px;font-weight:600;margin-top:14px;}
  .pw-field{position:relative;margin:0 24px 16px;}
  .pw-input{width:100%;background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 60px 14px 16px;font-size:15px;letter-spacing:2px;transition:border-color .2s, box-shadow .2s;}
  .pw-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
  .pw-toggle{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:12.5px;color:var(--primary);font-weight:600;}
  .strength-bar{height:6px;background:var(--border);border-radius:3px;margin:0 24px 6px;overflow:hidden;}
  .strength-fill{height:100%;width:64%;background:var(--success);border-radius:3px;transition:width .3s ease;}
  .strength-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin:0 24px 16px;}
  .req-card{margin:0 24px 20px;background:#fff;border-radius:14px;padding:14px 18px;border:1px solid var(--border);}
  .req-item{font-size:13px;padding:6px 0;color:var(--text-secondary);}
  .req-item.met{color:var(--success);font-weight:500;}
  .forgot-center{text-align:center;font-size:13px;color:var(--primary);font-weight:600;}

  /* Sign out modal */
  .modal-backdrop{position:absolute;inset:0;background:rgba(20,20,20,0.35);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:0 30px;}
  .modal-box{background:#fff;border-radius:24px;padding:32px 26px;text-align:center;width:100%;box-shadow:var(--shadow-lg);}
  .modal-icon{width:64px;height:64px;border-radius:50%;background:var(--warning-tint);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .modal-title{font-size:19px;font-weight:700;margin-bottom:10px;}
  .modal-sub{font-size:13.5px;color:var(--text-secondary);line-height:1.5;margin-bottom:26px;}
  .modal-btns{display:flex;gap:10px;}
  .modal-btns button{flex:1;padding:14px;border-radius:14px;font-size:14px;font-weight:700;border:none;transition:all .15s ease;}
  .modal-btns button:hover{transform:translateY(-1px);}
  .btn-cancel{background:var(--bg);color:var(--text);}
  .btn-confirm{background:var(--warning);color:#fff;}

  /* Student tab */

screens.signout = () => `
  ${statusbar}
  <div class="profile-title">Profile</div>
  <div style="position:relative;height:700px;">
    <div class="modal-backdrop">
      <div class="modal-box">
        <div class="modal-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ba7517" stroke-width="1.8"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></div>
        <div class="modal-title">Sign out?</div>

        <div class="modal-btns">
          <button class="btn-cancel">Cancel</button>
          <button class="btn-confirm">Sign out</button>
        </div>
      </div>
    </div>
  </div>
`;

function renderCalendarGrid(){
  const dows = ['S','M','T','W','T','F','S'];
  let html = dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<3;i++) html += `<div class="cal-day"></div>`; // Jul 1 2026 = Wed
  const eventDays = [14,17,24];
  for(let d=1; d<=31; d++){
    const isToday = d===9;
    const hasEvent = eventDays.includes(d) && !isToday;
    html += `<div class="cal-day ${isToday?'today':''} ${hasEvent?'has-event':''}">${d}</div>`;
  }
  return html;
}

function showScreen(name){
  document.querySelectorAll('.screen-item').forEach(i=>i.classList.toggle('active', i.dataset.screen===name));
  document.getElementById('phone-content').innerHTML = screens[name]();
  const grid = document.getElementById('cal-grid');
  if(grid) grid.innerHTML = renderCalendarGrid();
  document.getElementById('phone-content').scrollTop = 0;
}

document.querySelectorAll('.screen-item').forEach(item=>{
  item.addEventListener('click', ()=>showScreen(item.dataset.screen));
});

showScreen('signin');
