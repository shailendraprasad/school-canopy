<div class="login-page">
  <div class="login-card">
    <div class="card-top">
      <span class="logo">🌳</span>
      <h1>School Canopy</h1>
      <span class="portal-label">Parent Portal</span>
    </div>
    <form (ngSubmit)="login()" class="login-form">
      @if (error()) { <div class="error-msg">{{ error() }}</div> }
      <div class="field">
        <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="Email address" required />
      </div>
      <div class="field">
        <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Password" required />
      </div>
      <button type="submit" [disabled]="loading()" class="btn-login">
        {{ loading() ? 'Signing in...' : 'Sign In →' }}
      </button>
    </form>
    <p class="hint">First time? Check your email for the invitation link from your school.</p>
  </div>
</div>
