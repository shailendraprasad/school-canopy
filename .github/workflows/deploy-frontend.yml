# .github/workflows/deploy-frontend.yml
name: Deploy Frontends to Firebase Hosting

on:
  push:
    branches: [master]
    paths:
      - 'platform-admin/**'
      - 'school-portal/**'
      - 'parent-portal/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: {}   # lets you trigger it manually too

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Platform Admin
        working-directory: platform-admin
        run: |
          npm ci
          npx ng build --configuration staging

      - name: Build School Portal
        working-directory: school-portal
        run: |
          npm ci
          npx ng build --configuration staging

      - name: Build Parent Portal
        working-directory: parent-portal
        run: |
          npm ci
          npx ng build --configuration staging

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # firebase-tools currently doesn't reliably honor Workload Identity
      # Federation / ADC credentials (open bugs upstream), so we use a
      # Firebase CI token generated once via `firebase login:ci` instead.
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --project school-canopy --token "$FIREBASE_TOKEN" --non-interactive
