services:
  postgres:
    image: postgres:16-alpine
    container_name: schoolcanopy-db
    environment:
      POSTGRES_USER: schoolcanopy
      POSTGRES_PASSWORD: schoolcanopy_dev
      POSTGRES_DB: schoolcanopy
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolcanopy -d schoolcanopy"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schoolcanopy-backend
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/schoolcanopy
      QUARKUS_DATASOURCE_USERNAME: schoolcanopy
      QUARKUS_DATASOURCE_PASSWORD: schoolcanopy_dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
