    <header class="topbar"><h2>Audit Log</h2></header>
    <div class="filters">
      <select [(ngModel)]="actionType" (change)="filter()">
        <option value="">All Actions</option>
        <option value="SCHOOL_ONBOARDED">School Onboarded</option>
        <option value="SCHOOL_DEACTIVATED">School Deactivated</option>
        <option value="PLATFORM_TEAM_MEMBER_CREATED">Team Member Created</option>
        <option value="SCHOOL_ADMINISTRATOR_CREATED">Admin Created</option>
        <option value="CONFIG_CHANGED">Config Changed</option>
      </select>
    </div>
    <div class="table-wrapper">
      <table>
        <thead><tr><th>Timestamp</th><th>Action</th><th>Target</th><th>Details</th></tr></thead>
        <tbody>
          @for (log of logs(); track log.id) {
            <tr>
              <td class="mono">{{ log.createdAt | date:'short' }}</td>
              <td><span class="action-badge">{{ log.actionType }}</span></td>
              <td class="mono">{{ log.targetEntityId | slice:0:8 }}...</td>
              <td class="details">{{ log.details }}</td>
            </tr>
          }
          @empty { <tr><td colspan="4" class="empty">No audit log entries.</td></tr> }
        </tbody>
      </table>
    </div>
